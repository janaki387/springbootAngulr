<div class="max-w-6xl mx-auto p-6">
  <!-- Filters -->
  <app-lead-filter></app-lead-filter>

  <!-- Leads Table -->
  <table class="w-full border-collapse shadow rounded mt-6">
    <thead>
      <tr class="bg-gray-100">
        <th class="p-2 text-left">Name</th>
        <th class="p-2 text-left">Phone</th>
        <th class="p-2 text-left">Email</th>
        <th class="p-2 text-left">Location</th>
        <th class="p-2 text-left">Status</th>
        <th class="p-2 text-left">Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let lead of leads" class="border-b">
        <td class="p-2">{{ lead.fullName }}</td>
        <td class="p-2">{{ lead.phone }}</td>
        <td class="p-2">{{ lead.email }}</td>
        <td class="p-2">{{ lead.location }}</td>
        <td class="p-2">
          <span class="px-2 py-1 rounded text-white"
                [ngClass]="{
                  'bg-blue-500': lead.status === 'New Lead',
                  'bg-yellow-500': lead.status === 'Contacted',
                  'bg-purple-500': lead.status === 'Site Visit Scheduled',
                  'bg-orange-500': lead.status === 'Proposal Sent',
                  'bg-green-600': lead.status === 'Won',
                  'bg-red-600': lead.status === 'Lost'
                }">
            {{ lead.status }}
          </span>
        </td>
        <td class="p-2 space-x-2">
          <button class="bg-blue-600 text-white px-3 py-1 rounded" (click)="viewLead(lead.id)">View</button>
          <button class="bg-yellow-600 text-white px-3 py-1 rounded" (click)="editLead(lead.id)">Edit</button>
          <button class="bg-red-600 text-white px-3 py-1 rounded" (click)="deleteLead(lead.id)">Delete</button>
        </td>
      </tr>
    </tbody>
  </table>
</div>
