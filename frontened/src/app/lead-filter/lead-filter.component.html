<div class="max-w-4xl mx-auto p-6 bg-white shadow rounded space-y-6">
  <h2 class="text-2xl font-bold text-gray-700">Filter Leads</h2>

  <!-- Filter controls -->
  <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
    <div>
      <label class="block text-gray-600 mb-1">Search</label>
      <input type="text" [(ngModel)]="searchText"
             (input)="applyFilter()"
             placeholder="Search by name, email, phone"
             class="w-full border rounded px-3 py-2 focus:ring focus:ring-blue-300" />
    </div>

    <div>
      <label class="block text-gray-600 mb-1">Status</label>
      <select [(ngModel)]="selectedStatus" (change)="applyFilter()"
              class="w-full border rounded px-3 py-2">
        <option value="">All</option>
        <option *ngFor="let status of statuses" [value]="status">{{ status }}</option>
      </select>
    </div>

    <div>
      <label class="block text-gray-600 mb-1">Property Type</label>
      <select [(ngModel)]="selectedPropertyType" (change)="applyFilter()"
              class="w-full border rounded px-3 py-2">
        <option value="">All</option>
        <option *ngFor="let type of propertyTypes" [value]="type">{{ type }}</option>
      </select>
    </div>
  </div>

  <!-- Reset button -->
  <div>
    <button (click)="resetFilter()" class="bg-gray-500 text-white px-4 py-2 rounded mt-2">
      Reset Filters
    </button>
  </div>

  <!-- Filtered results -->
  <div class="mt-6">
    <h3 class="text-xl font-semibold mb-4">Filtered Leads</h3>
    <table class="w-full border-collapse">
      <thead>
        <tr class="bg-gray-100">
          <th class="p-2 text-left">Name</th>
          <th class="p-2 text-left">Email</th>
          <th class="p-2 text-left">Phone</th>
          <th class="p-2 text-left">Status</th>
          <th class="p-2 text-left">Property Type</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let lead of filteredLeads" class="border-b">
          <td class="p-2">{{ lead.fullName }}</td>
          <td class="p-2">{{ lead.email }}</td>
          <td class="p-2">{{ lead.phone }}</td>
          <td class="p-2">{{ lead.status }}</td>
          <td class="p-2">{{ lead.propertyType }}</td>
        </tr>
      </tbody>
    </table>

    <div *ngIf="filteredLeads.length === 0" class="text-gray-500 mt-4">
      No leads match your filters.
    </div>
  </div>
</div>
